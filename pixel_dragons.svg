<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#0d0d0d"/>

  <!-- scanline texture -->
  <rect width="900" height="1" y="20" fill="#86efac" opacity="0.04"/>
  <rect width="900" height="1" y="40" fill="#86efac" opacity="0.04"/>
  <rect width="900" height="1" y="60" fill="#86efac" opacity="0.04"/>
  <rect width="900" height="1" y="80" fill="#86efac" opacity="0.04"/>
  <rect width="900" height="1" y="100" fill="#86efac" opacity="0.04"/>

  <!-- DRAGON LEFT (facing right, 8px pixel grid) -->
  <!-- body -->
  <rect x="40" y="56" width="8" height="8" fill="#86efac"/>
  <rect x="48" y="56" width="8" height="8" fill="#86efac"/>
  <rect x="56" y="56" width="8" height="8" fill="#86efac"/>
  <rect x="64" y="56" width="8" height="8" fill="#86efac"/>
  <rect x="72" y="56" width="8" height="8" fill="#86efac"/>
  <rect x="80" y="56" width="8" height="8" fill="#86efac"/>
  <!-- belly lighter -->
  <rect x="48" y="64" width="8" height="8" fill="#4ade80"/>
  <rect x="56" y="64" width="8" height="8" fill="#4ade80"/>
  <rect x="64" y="64" width="8" height="8" fill="#4ade80"/>
  <rect x="72" y="64" width="8" height="8" fill="#4ade80"/>
  <!-- neck -->
  <rect x="80" y="48" width="8" height="8" fill="#86efac"/>
  <rect x="88" y="48" width="8" height="8" fill="#86efac"/>
  <!-- head -->
  <rect x="88" y="40" width="8" height="8" fill="#86efac"/>
  <rect x="96" y="40" width="8" height="8" fill="#86efac"/>
  <rect x="104" y="40" width="8" height="8" fill="#86efac"/>
  <rect x="88" y="48" width="8" height="8" fill="#86efac"/>
  <rect x="96" y="48" width="8" height="8" fill="#86efac"/>
  <rect x="104" y="48" width="8" height="8" fill="#86efac"/>
  <!-- snout -->
  <rect x="112" y="44" width="8" height="8" fill="#86efac"/>
  <rect x="120" y="44" width="8" height="8" fill="#86efac"/>
  <!-- eye -->
  <rect x="104" y="40" width="8" height="8" fill="#f472b6"/>
  <!-- horn -->
  <rect x="96" y="32" width="8" height="8" fill="#f472b6"/>
  <rect x="88" y="24" width="8" height="8" fill="#f472b6"/>
  <!-- fire breath -->
  <rect x="128" y="40" width="8" height="8" fill="#f472b6" opacity="0.9"/>
  <rect x="136" y="36" width="8" height="8" fill="#f472b6" opacity="0.7"/>
  <rect x="144" y="32" width="8" height="8" fill="#fbbf24" opacity="0.6"/>
  <rect x="152" y="28" width="8" height="8" fill="#fbbf24" opacity="0.4"/>
  <rect x="136" y="44" width="8" height="8" fill="#fbbf24" opacity="0.5"/>
  <rect x="144" y="40" width="8" height="8" fill="#fbbf24" opacity="0.3"/>
  <!-- tail -->
  <rect x="32" y="56" width="8" height="8" fill="#86efac"/>
  <rect x="24" y="60" width="8" height="8" fill="#86efac"/>
  <rect x="16" y="64" width="8" height="8" fill="#4ade80"/>
  <!-- wing -->
  <rect x="56" y="40" width="8" height="8" fill="#86efac" opacity="0.8"/>
  <rect x="56" y="32" width="8" height="8" fill="#86efac" opacity="0.6"/>
  <rect x="64" y="32" width="8" height="8" fill="#86efac" opacity="0.5"/>
  <rect x="48" y="32" width="8" height="8" fill="#86efac" opacity="0.5"/>
  <rect x="48" y="24" width="8" height="8" fill="#86efac" opacity="0.3"/>
  <rect x="64" y="24" width="8" height="8" fill="#86efac" opacity="0.3"/>
  <!-- legs -->
  <rect x="56" y="72" width="8" height="8" fill="#4ade80"/>
  <rect x="56" y="80" width="8" height="8" fill="#4ade80"/>
  <rect x="72" y="72" width="8" height="8" fill="#4ade80"/>
  <rect x="72" y="80" width="8" height="8" fill="#4ade80"/>
  <!-- claws -->
  <rect x="48" y="88" width="8" height="4" fill="#86efac"/>
  <rect x="56" y="88" width="8" height="4" fill="#86efac"/>
  <rect x="64" y="88" width="8" height="4" fill="#86efac"/>
  <rect x="72" y="88" width="8" height="4" fill="#86efac"/>
  <rect x="80" y="88" width="8" height="4" fill="#86efac"/>

  <!-- PIXEL TEXT center -->
  <text x="450" y="66" font-family="monospace" font-size="10" fill="#f472b6" opacity="0.35" text-anchor="middle" letter-spacing="6">~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~</text>
  <text x="450" y="50" font-family="monospace" font-size="9" fill="#86efac" opacity="0.2" text-anchor="middle" letter-spacing="4">[ DRAGON MODE ACTIVATED ]</text>

  <!-- DRAGON RIGHT (facing left, mirrored) -->
  <!-- body -->
  <rect x="772" y="56" width="8" height="8" fill="#f472b6"/>
  <rect x="764" y="56" width="8" height="8" fill="#f472b6"/>
  <rect x="756" y="56" width="8" height="8" fill="#f472b6"/>
  <rect x="748" y="56" width="8" height="8" fill="#f472b6"/>
  <rect x="740" y="56" width="8" height="8" fill="#f472b6"/>
  <rect x="732" y="56" width="8" height="8" fill="#f472b6"/>
  <!-- belly -->
  <rect x="764" y="64" width="8" height="8" fill="#db2777"/>
  <rect x="756" y="64" width="8" height="8" fill="#db2777"/>
  <rect x="748" y="64" width="8" height="8" fill="#db2777"/>
  <rect x="740" y="64" width="8" height="8" fill="#db2777"/>
  <!-- neck -->
  <rect x="724" y="48" width="8" height="8" fill="#f472b6"/>
  <rect x="716" y="48" width="8" height="8" fill="#f472b6"/>
  <!-- head -->
  <rect x="716" y="40" width="8" height="8" fill="#f472b6"/>
  <rect x="708" y="40" width="8" height="8" fill="#f472b6"/>
  <rect x="700" y="40" width="8" height="8" fill="#f472b6"/>
  <rect x="716" y="48" width="8" height="8" fill="#f472b6"/>
  <rect x="708" y="48" width="8" height="8" fill="#f472b6"/>
  <rect x="700" y="48" width="8" height="8" fill="#f472b6"/>
  <!-- snout -->
  <rect x="692" y="44" width="8" height="8" fill="#f472b6"/>
  <rect x="684" y="44" width="8" height="8" fill="#f472b6"/>
  <!-- eye -->
  <rect x="700" y="40" width="8" height="8" fill="#86efac"/>
  <!-- horn -->
  <rect x="708" y="32" width="8" height="8" fill="#86efac"/>
  <rect x="716" y="24" width="8" height="8" fill="#86efac"/>
  <!-- fire breath (left) -->
  <rect x="676" y="40" width="8" height="8" fill="#86efac" opacity="0.9"/>
  <rect x="668" y="36" width="8" height="8" fill="#86efac" opacity="0.7"/>
  <rect x="660" y="32" width="8" height="8" fill="#4ade80" opacity="0.6"/>
  <rect x="652" y="28" width="8" height="8" fill="#4ade80" opacity="0.4"/>
  <rect x="668" y="44" width="8" height="8" fill="#4ade80" opacity="0.5"/>
  <rect x="660" y="40" width="8" height="8" fill="#4ade80" opacity="0.3"/>
  <!-- tail -->
  <rect x="780" y="56" width="8" height="8" fill="#f472b6"/>
  <rect x="788" y="60" width="8" height="8" fill="#f472b6"/>
  <rect x="796" y="64" width="8" height="8" fill="#db2777"/>
  <!-- wing -->
  <rect x="748" y="40" width="8" height="8" fill="#f472b6" opacity="0.8"/>
  <rect x="748" y="32" width="8" height="8" fill="#f472b6" opacity="0.6"/>
  <rect x="740" y="32" width="8" height="8" fill="#f472b6" opacity="0.5"/>
  <rect x="756" y="32" width="8" height="8" fill="#f472b6" opacity="0.5"/>
  <rect x="740" y="24" width="8" height="8" fill="#f472b6" opacity="0.3"/>
  <rect x="756" y="24" width="8" height="8" fill="#f472b6" opacity="0.3"/>
  <!-- legs -->
  <rect x="748" y="72" width="8" height="8" fill="#db2777"/>
  <rect x="748" y="80" width="8" height="8" fill="#db2777"/>
  <rect x="732" y="72" width="8" height="8" fill="#db2777"/>
  <rect x="732" y="80" width="8" height="8" fill="#db2777"/>
  <!-- claws -->
  <rect x="724" y="88" width="8" height="4" fill="#f472b6"/>
  <rect x="732" y="88" width="8" height="4" fill="#f472b6"/>
  <rect x="740" y="88" width="8" height="4" fill="#f472b6"/>
  <rect x="748" y="88" width="8" height="4" fill="#f472b6"/>
  <rect x="756" y="88" width="8" height="4" fill="#f472b6"/>

  <!-- ground line -->
  <rect x="0" y="96" width="900" height="2" fill="#f472b6" opacity="0.15"/>
  <rect x="0" y="98" width="900" height="1" fill="#86efac" opacity="0.08"/>
